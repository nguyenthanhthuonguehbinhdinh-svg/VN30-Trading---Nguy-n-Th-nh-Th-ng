name: Daily VN30 update

on:
  schedule:
    # Giờ UTC. VN = UTC+7. GitHub thường chạy trễ 5–20 phút so với lịch.
    - cron: "17 7 * * 1-5"   # ~14:17 VN: tín hiệu DỰ KIẾN để đặt lệnh ATC (14:30–14:45)
    - cron: "23 8 * * 1-5"   # ~15:23 VN: CHỐT SỔ, khớp lệnh giấy theo giá đóng cửa
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | preview | close"
        type: choice
        options: [auto, preview, close]
        default: auto

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vn30-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Chạy engine
        run: python -m engine.run --mode ${{ github.event.inputs.mode || 'auto' }}

      - name: Lưu dữ liệu vào repo
        run: |
          git config user.name "vn30-bot"
          git config user.email "vn30-bot@users.noreply.github.com"
          git add docs/data state
          git diff --staged --quiet || git commit -m "data: $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M')"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
